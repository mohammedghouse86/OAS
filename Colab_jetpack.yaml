components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie for authentication

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: string
          description: User UUID
        email:
          type: string
          format: email
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        authProvider:
          type: string
          enum: [replit, email]
          default: replit
        emailVerified:
          type: boolean
          default: false
        subscriptionStatus:
          type: string
          enum: [active, inactive, canceled, past_due]
          default: inactive
        subscriptionTier:
          type: string
          enum: [free, basic, pro]
          default: free
        monthlyApiUsage:
          type: integer
          default: 0
        monthlyApiCost:
          type: integer
          description: API cost in cents
          default: 0
        monthlyApiLimit:
          type: integer
          description: API cost limit in cents
          default: 10000
        monthlyBudget:
          type: integer
          description: User-set monthly budget in cents
          default: 0
        isAdmin:
          type: boolean
          default: false
        accountStatus:
          type: string
          enum: [active, cancelled, deleted]
          default: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - authProvider
        - subscriptionStatus
        - subscriptionTier
        - createdAt
        - updatedAt

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Project UUID
        name:
          type: string
        description:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
        targetAudience:
          type: string
          nullable: true
        keyFeatures:
          type: array
          items:
            type: string
        constraints:
          type: string
          nullable: true
        references:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        requirements:
          type: string
          nullable: true
        status:
          type: string
          enum: [planning, in_progress, completed, on_hold]
          default: planning
        userId:
          type: string
          description: Owner user UUID
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - userId
        - createdAt
        - updatedAt

    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        objective:
          type: string
        domain:
          type: string
        targetAudience:
          type: string
        keyFeatures:
          type: array
          items:
            type: string
        constraints:
          type: string
        references:
          type: string
        summary:
          type: string
        requirements:
          type: string
        status:
          type: string
          enum: [planning, in_progress, completed, on_hold]
      required:
        - name

    Interview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Interview UUID
        name:
          type: string
          description: Interview title
        projectId:
          type: string
          format: uuid
          description: Associated project UUID
        stakeholderType:
          type: string
          enum: [end_user, business_owner, developer, designer, product_manager, other]
        duration:
          type: integer
          nullable: true
          description: Duration in minutes
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled, processing, error]
          default: pending
          description: Interview status - 'processing' and 'error' are used for uploaded files
        progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Processing progress percentage for uploaded files (0-100)
        interviewSource:
          type: string
          enum: [ai_agent, human_moderated]
          default: ai_agent
          description: Source of the interview - AI agent or uploaded file
        transcriptionData:
          type: object
          nullable: true
          description: Transcription metadata and speaker analysis data
        shareLink:
          type: string
          format: uuid
          description: Unique share link for anonymous access
        participantName:
          type: string
          nullable: true
        participantEmail:
          type: string
          format: email
          nullable: true
        selectedForDocumentation:
          type: boolean
          default: false
        startedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        designData:
          type: object
          nullable: true
          description: Design-specific data like Figma links, colors, fonts
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - projectId
        - stakeholderType
        - status
        - shareLink
        - createdAt
        - updatedAt

    InterviewInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        stakeholderType:
          type: string
          enum: [end_user, business_owner, developer, designer, product_manager, other]
        duration:
          type: integer
          minimum: 5
          maximum: 120
        participantName:
          type: string
        participantEmail:
          type: string
          format: email
        selectedForDocumentation:
          type: boolean
        notes:
          type: string
        designData:
          type: object
      required:
        - name
        - stakeholderType

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Conversation UUID
        interviewId:
          type: string
          format: uuid
          description: Associated interview UUID
        participantMessage:
          type: string
          description: Message from participant
        agentResponse:
          type: string
          description: AI agent response
        audioUrl:
          type: string
          nullable: true
          description: URL to audio recording
        timestamp:
          type: string
          format: date-time
        context:
          type: string
          nullable: true
          description: Additional context for conversation
        createdAt:
          type: string
          format: date-time
