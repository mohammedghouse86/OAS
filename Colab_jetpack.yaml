openapi: 3.0.3
info:
  title: VoiceAgent SaaS Platform API
  description: |
    A comprehensive SaaS platform designed to facilitate voice-based stakeholder interviews. 
    The platform automatically generates technical documentation and Replit prompts using advanced AI.
    
    ## Features
    - Voice-based stakeholder interviews with AI-powered conversation
    - Video/audio file upload with background transcription processing
    - Automatic transcription and analysis with enhanced formatting
    - Real-time progress tracking for uploaded files
    - Multi-perspective documentation generation
    - Technical requirements creation
    - Replit-specific prompt generation
    - Multi-tenant architecture with secure data isolation
    - Subscription billing with Stripe integration
    - Real-time audio processing and WebSocket communication
    - Admin dashboard with analytics and user management
    - Blog management system
    - Visitor tracking and conversion analytics
    - OpenAI cost monitoring and budget controls
    
    ## Authentication
    The API supports two authentication methods:
    1. **Replit OAuth** - Uses OpenID Connect for seamless integration with Replit accounts
    2. **Email/Password** - Traditional authentication with password recovery
    
    ## UUID Security
    All main entities (projects, interviews, documents, conversations, transcripts, users) 
    use UUID primary keys to prevent resource enumeration attacks while maintaining 
    security in anonymous contexts.
    
    ## Rate Limiting & Usage Controls
    The API implements sophisticated usage controls:
    - Subscription-based feature limits
    - OpenAI cost tracking with budget alerts
    - Pay-as-you-go pricing for overages
    - Real-time budget monitoring
    
  version: 1.0.0
  contact:
    name: Colab Jetpack Support
    url: https://colabjetpack.com
    email: support@colabjetpack.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://your-domain.replit.app/api
    description: Production server
  - url: http://localhost:5000/api
    description: Development server

paths:
  # Authentication Endpoints
  /auth/user:
    get:
      summary: Get authenticated user information
      description: Retrieves the current authenticated user's profile data
      tags:
        - Authentication
      security:
        - CookieAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Initiates password recovery process by sending reset email
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address for password reset
              required:
                - email
      responses:
        '200':
          description: Password reset email sent (if email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If this email exists, a password reset link will be sent."
        '400':
          description: Bad request - missing email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Resets user password using the token from email
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Password reset token from email
                newPassword:
                  type: string
                  minLength: 8
                  description: New password for the account
              required:
                - token
                - newPassword
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully"
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/cancel-account:
    post:
      summary: Cancel user account
      description: Cancels the authenticated user's account
      tags:
        - Authentication
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Account cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account cancelled successfully"
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Project Management
  /projects:
    get:
      summary: Get user's projects
      description: Retrieves all projects belonging to the authenticated user
      tags:
        - Projects
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new project
      description: Creates a new project for the authenticated user
      tags:
        - Projects
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}:
    get:
      summary: Get project by ID
      description: Retrieves a specific project by its UUID
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update project
      description: Updates an existing project
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete project
      description: Deletes a project and all associated data
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Project deleted successfully"
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Interview Management
  /projects/{projectId}/interviews:
    get:
      summary: Get project interviews
      description: Retrieves all interviews for a specific project
      tags:
        - Interviews
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      responses:
        '200':
          description: Interviews retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interview'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create interview
      description: Creates a new interview within a project
      tags:
        - Interviews
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewInput'
      responses:
        '201':
          description: Interview created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{projectId}/interviews/upload:
    post:
      summary: Upload video/audio for interview
      description: |
        Uploads a video or audio file for background transcription and interview creation.
        Supports files up to 25MB (OpenAI Whisper limit). Processing happens in the background
        with real-time progress tracking available via the progress endpoint.
      tags:
        - Interviews
        - File Upload
      security:
        - CookieAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
          description: Project ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio or video file (max 25MB)
                name:
                  type: string
                  description: Name for the interview
                stakeholderType:
                  type: string
                  description: Type of stakeholder being interviewed
              required:
                - file
                - name
                - stakeholderType
      responses:
        '201':
          description: File uploaded successfully, interview created and processing started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Interview'
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [processing]
                        description: Interview status during background processing
                      progress:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: Processing progress percentage
        '400':
          description: Invalid file or request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large (exceeds 25MB limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interviews/{id}/progress:
    get:
      summary: Get interview processing progress
      description: |
        Retrieves the current processing progress for an uploaded interview.
        Returns progress percentage and status for background transcription processing.
      tags:
        - Interviews
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Interview ID
      responses:
        '200':
          description: Progress information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Interview ID
                  status:
                    type: string
                    enum: [processing, completed, error]
                    description: Current processing status
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Processing progress percentage (0-100)
                required:
                  - id
                  - status
                  - progress
        '404':
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interviews/{id}:
    get:
      summary: Get interview by ID
      description: Retrieves a specific interview by its UUID (supports anonymous access via share link)
      tags:
        - Interviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Interview UUID
        - name: shareLink
          in: query
          schema:
            type: string
            format: uuid
          description: Share link UUID for anonymous access
      responses:
        '200':
          description: Interview retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '404':
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update interview
      description: Updates an existing interview
      tags:
        - Interviews
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Interview UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewInput'
      responses:
        '200':
          description: Interview updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
        '404':
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Voice Processing & AI
  /interviews/{id}/transcribe:
    post:
      summary: Transcribe audio
      description: Transcribes audio from voice interviews using OpenAI Whisper
      tags:
        - Voice Processing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Interview UUID
        - name: shareLink
          in: query
          schema:
            type: string
            format: uuid
          description: Share link UUID for anonymous access
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file to transcribe
                context:
                  type: string
                  description: Additional context for better transcription
      responses:
        '200':
          description: Transcription completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription:
                    type: string
                    description: Transcribed text from audio
        '400':
          description: Invalid request or audio file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interviews/{id}/respond:
    post:
      summary: Generate AI response
      description: Generates AI-powered response for interview conversation
      tags:
        - Voice Processing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Interview UUID
        - name: shareLink
          in: query
          schema:
            type: string
            format: uuid
          description: Share link UUID for anonymous access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: User message to respond to
                context:
                  type: string
                  description: Conversation context
                stakeholderType:
                  type: string
                  description: Type of stakeholder being interviewed
              required:
                - message
      responses:
        '200':
          description: AI response generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI-generated response text
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interviews/{id}/speech:
    post:
      summary: Generate speech audio
      description: Converts text to speech using OpenAI TTS
      tags:
        - Voice Processing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Interview UUID
        - name: shareLink
          in: query
          schema:
            type: string
            format: uuid
          description: Share link UUID for anonymous access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Text to convert to speech
                voice:
                  type: string
                  enum: [alloy, echo, fable, onyx, nova, shimmer]
                  default: alloy
                  description: Voice model to use for TTS
              required:
                - text
      responses:
        '200':
          description: Speech audio generated successfully
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Conversations & Transcripts
  /conversations:
    post:
      summary: Create conversation
      description: Creates a new conversation record for an interview
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationInput'
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{id}:
    get:
      summary: Get conversation
      description: Retrieves a conversation by its UUID (supports anonymous access)
      tags:
        - Conversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - name: shareLink
          in: query
          schema:
            type: string
            format: uuid
          description: Share link UUID for anonymous access
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transcripts:
    post:
      summary: Create transcript
      description: Creates a new transcript for an interview
      tags:
        - Transcripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptInput'
      responses:
        '201':
          description: Transcript created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transcripts/{id}:
    get:
      summary: Get transcript
      description: Retrieves a transcript by its UUID
      tags:
        - Transcripts
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Transcript UUID
      responses:
        '200':
          description: Transcript retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          description: Transcript not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update transcript
      description: Updates an existing transcript (for corrections)
      tags:
        - Transcripts
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Transcript UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptInput'
      responses:
        '200':
          description: Transcript updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '404':
          description: Transcript not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Documentation Generation
  /documents:
    post:
      summary: Generate documentation
      description: Generates technical documentation from interview data
      tags:
        - Documentation
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Documentation generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /documents/{id}:
    get:
      summary: Get document
      description: Retrieves a document by its UUID
      tags:
        - Documentation
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Document UUID
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update document
      description: Updates an existing document
      tags:
        - Documentation
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Document UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '200':
          description: Document updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # AI-Generated Prompts
  /replit-prompts:
    post:
      summary: Generate Replit prompt
      description: Generates optimized prompts for Replit development
      tags:
        - AI Prompts
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplitPromptInput'
      responses:
        '201':
          description: Replit prompt generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplitPrompt'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /replit-prompts/{id}:
    get:
      summary: Get Replit prompt
      description: Retrieves a Replit prompt by its UUID
      tags:
        - AI Prompts
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Replit prompt UUID
      responses:
        '200':
          description: Replit prompt retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplitPrompt'
        '404':
          description: Replit prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Subscription Management
  /subscription-plans:
    get:
      summary: Get subscription plans
      description: Retrieves all available subscription plans
      tags:
        - Subscriptions
      responses:
        '200':
          description: Subscription plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'

  /check-usage-limit:
    post:
      summary: Check usage limits
      description: Validates if user can perform an action based on their subscription plan
      tags:
        - Subscriptions
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [project, interview, summary, requirements, prompt]
                  description: Action to check limit for
                projectId:
                  type: string
                  format: uuid
                  description: Project UUID (required for interview limit checks)
              required:
                - action
      responses:
        '200':
          description: Usage limit check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  canProceed:
                    type: boolean
                    description: Whether the user can proceed with the action
        '401':
          description: Unauthorized
          content:
